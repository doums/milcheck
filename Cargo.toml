[package]
name = "milcheck"
version = "0.3.5"
authors = ["Pierre D. <dommerc.pierre@gmail.com>"]
license = "MPL-2.0"
edition = "2024"
description = "A CLI to get pacman mirrorlist status and the Arch Linux latest news"
repository = "https://github.com/doums/milcheck"
readme = "README.md"
keywords = ["archlinux", "pacman", "mirror", "mirrorlist"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.29"
env_logger = "0.11.10"
clap = { version = "4.6", features = ["derive"] }
termion = "1.5.6"
reqwest = {
  version = "0.13",
  default-features = false,
  features = ["http2", "native-tls", "blocking", "json"]
}
html2text = "0.17"
chrono = "0.4"
rss = "2.0"

[profile.release]
strip = true
opt-level = "s"
lto = true
